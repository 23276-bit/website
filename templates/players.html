{% extends "base.html" %}

{% block content %}
    <div class="players">
        {% for player in player %}
            <div class="player">
                <div>

                </div>
                <div class="player-text">
                    <span>Name: {{ player[1] }}</span>
                    <span>Cap_Number: {{ player[2] }}</span>
                    <span>Age: {{ player[3] }}</span>
                    <span>Position: {{ player[4] }}</span>
                    <span>Stick: {{ player[5] }}</span>
                    <span>Ghost: {{ player[6] }}</span>
                    <span>Stick_Type: {{ player[7] }}</span>
                    <span>Club: {{ player[8] }}</span>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
